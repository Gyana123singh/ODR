<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>ODR APP</title>
    <script>
      (function() {
        var urlParams = new URLSearchParams(window.location.search);
        var langParam = urlParams.get('lang');
        if (langParam) {
          var domain = window.location.hostname;
          if (langParam === 'en') {
             document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + domain;
             document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
             document.cookie = 'googtrans=/en/en; path=/; domain=' + domain;
             document.cookie = 'googtrans=/en/en; path=/;';
          } else {
             var cookieVal = '/en/' + langParam;
             document.cookie = 'googtrans=' + cookieVal + '; path=/; domain=' + domain;
             document.cookie = 'googtrans=' + cookieVal + '; path=/;';
          }
          urlParams.delete('lang');
          var newUrl = window.location.pathname + (urlParams.toString() ? '?' + urlParams.toString() : '') + window.location.hash;
          window.history.replaceState({}, '', newUrl);
        }

        document.addEventListener('click', function(e) {
          var link = e.target.closest('a');
          if (link && link.href) {
            try {
              var targetUrl = new URL(link.href);
              var currentUrl = new URL(window.location.href);
              if (targetUrl.hostname !== currentUrl.hostname && 
                 (targetUrl.hostname.includes('utkalodr.com') || targetUrl.hostname.includes('gokulanandachaudhurifoundation.com'))) {
                
                var currentLang = 'en';
                var match = document.cookie.match(/(?:^|;)\s*googtrans=([^;]*)/);
                if (match && match[1]) {
                  var parts = decodeURIComponent(match[1]).split('/');
                  var langCookie = parts[parts.length - 1];
                  if (langCookie && langCookie !== 'auto') {
                    currentLang = langCookie;
                  }
                }
                targetUrl.searchParams.set('lang', currentLang);
                link.href = targetUrl.toString();
              }
            } catch(err) {}
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="position: absolute; opacity: 0; z-index: -100; pointer-events: none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en', autoDisplay: false}, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
