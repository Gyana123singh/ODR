name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend to VPS
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            cd /var/www/ODR
            git pull origin main

            cd frontend
            
            # Dynamically create the .env file on the server for the production build
            cat << 'EOF' > .env
            VITE_API_BASE_URL=https://gokulanandachaudhurifoundation.com
            VITE_FIREBASE_API_KEY=AIzaSyAurz8Xb77hEkG_HsZ_xhkxpTXTAIkJtCw
            VITE_FIREBASE_AUTH_DOMAIN=odr-project-e9661.firebaseapp.com
            VITE_FIREBASE_PROJECT_ID=odr-project-e9661
            VITE_FIREBASE_STORAGE_BUCKET=odr-project-e9661.firebasestorage.app
            VITE_FIREBASE_MESSAGING_SENDER_ID=787835897809
            VITE_FIREBASE_APP_ID=1:787835897809:web:3575c48a250f20ccecc2f0
            EOF

            npm install
            npm run build

            echo "Frontend build completed."