<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Dispute Details Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Hide Google Translate elements */
        iframe.goog-te-banner-frame,
        .goog-te-banner-frame,
        .goog-te-gadget-icon,
        .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
        .VIpgJd-ZVi9od-aZ2wEe-wOHMyf-ti6hGc,
        .VIpgJd-ZVi9od-ORHb-OEVmcd {
            display: none !important;
            visibility: hidden !important;
            height: 0px !important;
        }
        body {
            top: 0px !important;
            position: static !important;
        }
        #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
        .goog-text-highlight { background-color: transparent !important; box-shadow: none !important; }
    </style>
</head>


<body class="bg-light">

  <div class="container my-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">

        <!-- Back Button -->
        <div class="mb-3">
          <a href="index.html" class="btn btn-outline-secondary">
            ← Back
          </a>
        </div>

        <form id="contactForm">
        <h4 class="mb-4">Dispute Details</h4>

        <!-- Dispute Type -->
        <div class="mb-3">
          <label class="form-label">Dispute type</label>
          <select class="form-select" id="disputeType">
            <option selected>Select Dispute</option>
            <option>Commercial</option>
            <option>Family</option>
            <option>Property</option>
          </select>
        </div>

        <!-- Dispute Name -->
        <div class="mb-3">
          <label class="form-label">Dispute Name</label>
          <input type="text" class="form-control" id="disputeName" placeholder="Enter Dispute Name">
        </div>

        <!-- Dispute Amount -->
        <div class="mb-4">
          <label class="form-label">Dispute Amount</label>
          <select class="form-select" id="disputeAmount">
            <option selected>Select Amount</option>
            <option>Below ₹1,00,000</option>
            <option>₹1,00,000 - ₹5,00,000</option>
            <option>Above ₹5,00,000</option>
          </select>
        </div>

        <!-- Customer Details -->
        <h6 class="mb-3">Customer Details</h6>

        <div class="mb-3">
          <label class="form-label">Customers Name</label>
          <input type="text" class="form-control" id="customerName" placeholder="Enter Opposite Party Name">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="customerEmail" placeholder="Enter Opposite Party Email">
        </div>

        <div class="mb-3">
          <label class="form-label">MobileNumber</label>
          <input type="text" class="form-control" id="customerMobile" placeholder="Enter Opposite Party Mobile Number">
        </div>

        <div class="mb-4">
          <label class="form-label">AadharNumber</label>
          <input type="text" class="form-control" id="customerAadhar" placeholder="Enter Opposite Party Mobile Number">
        </div>

        <!-- Opposite Party Details -->
        <h6 class="mb-3">Opposite Party Details</h6>

        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" id="oppositeName" placeholder="Enter Opposite Party Name">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="oppositeEmail" placeholder="Enter Opposite Party Email">
        </div>

        <div class="mb-4">
          <label class="form-label">Mobile Number</label>
          <input type="text" class="form-control" id="oppositeMobile" placeholder="Enter Opposite Party Mobile Number">
        </div>

        <!-- Consent -->
        <div class="mb-4">
          <label class="form-label">Consent as per Data Protection Acts</label>
          <select class="form-select" id="consent">
            <option selected>Yes</option>
            <option>No</option>
          </select>
        </div>

        <!-- File Upload -->
        <div class="mb-4">
          <label class="form-label">Attach File</label>
          <input type="file" class="form-control" id="attachment">
        </div>

        <!-- Submit Button -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">Submit</button>
        </div>
        </form>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Connect Form to Backend -->
  <script>
    document.getElementById('contactForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      // Gather data using FormData for file support
      const formData = new FormData();
      formData.append('disputeType', document.getElementById('disputeType').value);
      formData.append('disputeName', document.getElementById('disputeName').value);
      formData.append('disputeAmount', document.getElementById('disputeAmount').value);
      formData.append('customerName', document.getElementById('customerName').value);
      formData.append('customerEmail', document.getElementById('customerEmail').value);
      formData.append('customerMobile', document.getElementById('customerMobile').value);
      formData.append('customerAadhar', document.getElementById('customerAadhar').value);
      formData.append('oppositeName', document.getElementById('oppositeName').value);
      formData.append('oppositeEmail', document.getElementById('oppositeEmail').value);
      formData.append('oppositeMobile', document.getElementById('oppositeMobile').value);
      formData.append('consent', document.getElementById('consent').value);

      const fileInput = document.getElementById('attachment');
      if (fileInput.files.length > 0) {
        formData.append('file', fileInput.files[0]);
      }

      try {
        const response = await fetch('http://localhost:3636/api/landing/contact', {
          method: 'POST',
          // Do not set Content-Type header manually when using FormData, 
          // the browser will automatically set it to multipart/form-data with the correct boundary
          body: formData
        });

        if (response.ok) {
          alert('Dispute Details submitted successfully!');
          window.location.href = 'index.html'; // Redirect to home
        } else {
          const data = await response.json();
          alert('Failed to submit: ' + (data.error || 'Unknown error'));
        }
      } catch (error) {
        console.error('Error submitting form:', error);
        alert('Could not connect to the server.');
      }
    });
  </script>

    <!-- Hidden Google Translate Element -->
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,hi,or', 
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>


</html>
