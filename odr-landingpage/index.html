    <style>
        .odr-image img {
            border-radius: 12px;
            max-height: 420px;
            object-fit: cover;

        .whatsapp-float {
            position: fixed;
            width: 56px;
            height: 56px;
            bottom: 40px;
            right: 20px;
            background-color: #25D366;
            color: #fff;
            border-radius: 50%;
            text-align: center;
            font-size: 30px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .whatsapp-float {
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            color: #fff;
        }

        /* Mobile optimization */
        @media (max-width: 576px) {
            .whatsapp-float {
