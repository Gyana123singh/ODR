    <style>
        .odr-image img {

        .whatsapp-float {

        }

        .whatsapp-float {
            text-decoration: none;

        .whatsapp-float:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            color: #fff;

        /* Mobile optimization */
        @media (max-width: 576px) {

        /* Hide Google Translate elements */
        iframe.goog-te-banner-frame,
        .goog-te-banner-frame,
        .goog-te-gadget-icon,
        .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
        .VIpgJd-ZVi9od-aZ2wEe-wOHMyf-ti6hGc,

        /* Hide hover tooltips */
        #goog-gt-tt, .goog-te-balloon-frame {
            display: none !important;
        }
        .goog-text-highlight {
            background-color: transparent !important;
            box-shadow: none !important;
        }
    </style>
    <script>
      (function() {
        var urlParams = new URLSearchParams(window.location.search);
        var langParam = urlParams.get('lang');
        if (langParam) {
          var domain = window.location.hostname;
          if (langParam === 'en') {
             document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + domain;
             document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
             document.cookie = 'googtrans=/en/en; path=/; domain=' + domain;
             document.cookie = 'googtrans=/en/en; path=/;';
          } else {
             var cookieVal = '/en/' + langParam;
             document.cookie = 'googtrans=' + cookieVal + '; path=/; domain=' + domain;
             document.cookie = 'googtrans=' + cookieVal + '; path=/;';
          }
          urlParams.delete('lang');
          var newUrl = window.location.pathname + (urlParams.toString() ? '?' + urlParams.toString() : '') + window.location.hash;
          window.history.replaceState({}, '', newUrl);
        }

        document.addEventListener('click', function(e) {
          var link = e.target.closest('a');
          if (link && link.href) {
            try {
              var targetUrl = new URL(link.href);
              var currentUrl = new URL(window.location.href);
              if (targetUrl.hostname !== currentUrl.hostname && 
                 (targetUrl.hostname.includes('utkalodr.com') || targetUrl.hostname.includes('gokulanandachaudhurifoundation.com'))) {
                
                var currentLang = 'en';
                var combo = document.querySelector('.goog-te-combo');
                if (combo && combo.value) {
                  currentLang = combo.value;
                } else {
                  var matches = document.cookie.match(/(?:^|;)\s*googtrans=([^;]*)/g);
                  if (matches && matches.length > 0) {
                    var lastMatch = matches[matches.length - 1];
                    var val = lastMatch.split('=')[1];
                    if (val) {
                      var parts = decodeURIComponent(val).split('/');
                      var langCookie = parts[parts.length - 1];
                      if (langCookie && langCookie !== 'auto') {
                        currentLang = langCookie;
                      }
                    }
                  }
                }
                targetUrl.searchParams.set('lang', currentLang);
                link.href = targetUrl.toString();
              }
            } catch(err) {}
          }
        });
      })();
    </script>
